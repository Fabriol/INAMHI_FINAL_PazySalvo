# Configuración Nginx para el sistema Paz y Salvo (INAMHI)
# Destino en el servidor: /etc/nginx/sites-available/pazsalvo
# Instrucciones completas de instalación al final de este archivo (comentadas).

server {
    listen 80;
    listen [::]:80;
    server_name 10.0.153.64;

    client_max_body_size 25M;

    access_log /var/log/nginx/pazsalvo_access.log;
    error_log  /var/log/nginx/pazsalvo_error.log;

    # Archivos estáticos (CSS/JS/imágenes/PDFs temporales) servidos
    # directamente por Nginx: no pasan por Gunicorn, así que se sirven
    # más rápido y no consumen un worker de Python.
    location /static/ {
        alias /opt/paz_salvo/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/opt/paz_salvo/paz_salvo.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La generación/firma de PDF (WeasyPrint + pyHanko) puede tardar
        # varios segundos con documentos grandes: sin esto Nginx corta la
        # conexión a los 60s por defecto y el usuario ve un error aunque
        # Gunicorn siga trabajando.
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}

# =============================================================================
# INSTALACIÓN (ejecutar en el servidor, ver también el mensaje del chat con
# el resto de comandos de despliegue):
#
#   sudo cp deploy/nginx_pazsalvo.conf /etc/nginx/sites-available/pazsalvo
#   sudo ln -s /etc/nginx/sites-available/pazsalvo /etc/nginx/sites-enabled/pazsalvo
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
# =============================================================================
